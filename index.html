<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOP Academy - 智能培训系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bg-mesh"></div>

<!-- =================== 登录页 =================== -->
<div class="login-page" id="loginPage">
    <div class="login-card">
        <div class="login-logo">
            <h1>SOP Academy</h1>
            <p>智能培训系统 · 登录</p>
        </div>
        <div class="login-error" id="loginError"></div>
        <div class="form-group">
            <label>用户名</label>
            <input class="form-input" id="loginUser" placeholder="请输入用户名" autocomplete="username">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input class="form-input" id="loginPass" type="password" placeholder="请输入密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <button class="btn btn-primary btn-full" style="margin-top:8px;height:46px;font-size:16px" onclick="doLogin()">登 录</button>
        <div style="text-align:center;margin-top:20px;font-size:12px;color:var(--text-muted);line-height:2">

        </div>
    </div>
</div>

<!-- =================== 主应用 =================== -->
<div class="app" id="appRoot">
    <div class="bg-mesh"></div>
    <button class="mobile-toggle" id="mobileToggle" onclick="toggleSidebar()">☰</button>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1>SOP Academy</h1>
            <p>智能培训系统 v2.0</p>
        </div>
        <nav class="sidebar-nav" id="sidebarNav"></nav>
        <div class="sidebar-footer">
            <div class="user-card" onclick="doLogout()">
                <div class="user-avatar av-primary" id="userAvatar">U</div>
                <div>
                    <div class="user-name" id="userName">用户</div>
                    <div class="user-role" id="userRoleLabel">角色 · 点击退出</div>
                </div>
            </div>
        </div>
    </aside>

    <div class="main">
        <div class="main-inner" id="mainContent">
            <!-- 动态内容区域 -->
        </div>
    </div>
</div>

<!-- =================== 通知面板 =================== -->
<div class="notif-overlay" id="notifOverlay" onclick="closeNotifPanel()"></div>
<div class="notif-panel" id="notifPanel">
    <div class="notif-panel-header">
        <h3>🔔 通知</h3>
        <button class="btn btn-icon btn-ghost" onclick="closeNotifPanel()">✕</button>
    </div>
    <div class="notif-list" id="notifList">
        <div style="text-align:center;padding:40px 0;color:var(--text-muted)">加载中...</div>
    </div>
</div>

<!-- SVG渐变定义 -->
<svg style="position:absolute;width:0;height:0">
    <defs>
        <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#06b6d4"/>
        </linearGradient>
        <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#06b6d4"/>
        </linearGradient>
        <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#34d399"/>
        </linearGradient>
        <linearGradient id="barGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#fbbf24"/>
        </linearGradient>
    </defs>
</svg>

<!-- JavaScript文件加载顺序很重要 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/chapter-content.js"></script>
<script src="js/exam-questions.js"></script>
<script src="js/utils.js"></script>
<script src="js/local-data.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script src="js/pages-employee.js"></script>
<script src="js/pages-admin.js"></script>
<script src="js/pages-leader.js"></script>
<script src="js/exam.js"></script>

<script>
    // 启动应用
    document.addEventListener('DOMContentLoaded', initApp);
</script>

</body>
</html>
